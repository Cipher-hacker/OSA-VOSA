name: Reproducibility
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      native:
        description: Run native build and six protocol smoke tests on a 32-core Linux runner
        type: boolean
        default: false
jobs:
  reference:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r bench/requirements.txt
      - run: python artifact.py verify
      - run: python artifact.py test
      - run: python artifact.py replay --output outputs/replay
  native:
    if: github.event_name == 'workflow_dispatch' && inputs.native
    runs-on: [self-hosted, linux, x64, osa-32cpu]
    steps:
      - uses: actions/checkout@v4
      - run: python3.10 artifact.py setup
      - run: python3.10 artifact.py build
      - run: python3.10 artifact.py smoke

